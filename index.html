<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clark Family – Handy Links</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid #e2e8f0;
    }
    .header-inner {
      max-width: 900px; margin: 0 auto;
      padding: 0.9rem 1.25rem;
      display: flex; align-items: center; gap: 0.875rem;
    }
    .site-title { font-size: 1.2rem; font-weight: 700; color: #0f172a; white-space: nowrap; }
    .site-sub   { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }

    .add-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 0.95rem;
      background: #3b82f6; color: #fff;
      border: none; border-radius: 0.5rem;
      font-size: 0.8125rem; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .add-btn:hover { background: #2563eb; box-shadow: 0 2px 8px rgba(59,130,246,0.4); }

    .search-wrap { flex: 1; position: relative; max-width: 280px; margin-left: auto; }
    .search-wrap svg {
      position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; color: #94a3b8; pointer-events: none; flex-shrink: 0;
    }
    .search-input {
      width: 100%; padding: 0.5rem 2rem 0.5rem 2.1rem;
      border: 1px solid #e2e8f0; border-radius: 0.625rem;
      background: #f8fafc; font-size: 0.8125rem; font-family: inherit;
      color: #0f172a; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .search-input::placeholder { color: #94a3b8; }
    .search-input:focus {
      border-color: #93c5fd; background: #fff;
      box-shadow: 0 0 0 3px rgba(147,197,253,0.25);
    }
    .clear-btn {
      display: none; position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #94a3b8; font-size: 1.1rem; line-height: 1; padding: 0 0.2rem;
    }
    .clear-btn:hover { color: #64748b; }

    /* ── Main ────────────────────────────────────────────────────────── */
    .main {
      max-width: 900px; margin: 0 auto;
      padding: 1.25rem 1.25rem 3rem;
      display: flex; flex-direction: column; gap: 0.875rem;
    }

    /* ── Category card ───────────────────────────────────────────────── */
    .cat-card {
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 1rem; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: box-shadow 0.2s;
    }
    .cat-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.09); }
    .cat-header {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.75rem 1.1rem; border-bottom: 1px solid transparent;
    }
    .cat-icon { font-size: 1.05rem; line-height: 1; }
    .cat-name { font-size: 0.875rem; font-weight: 600; color: #1e293b; }
    .cat-badge {
      margin-left: auto; font-size: 0.7rem; font-weight: 700;
      padding: 0.15rem 0.55rem; border-radius: 9999px;
    }
    .cat-links {
      padding: 0.875rem 1.1rem;
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      min-height: 10px;
    }

    /* ── Link wrap (positions the × button) ─────────────────────────── */
    .link-wrap { position: relative; display: inline-flex; }
    .link-wrap .del {
      display: none; position: absolute; top: -5px; right: -5px;
      width: 16px; height: 16px;
      background: #ef4444; color: #fff;
      border: 2px solid #fff; border-radius: 50%;
      font-size: 9px; font-weight: 800; line-height: 1;
      cursor: pointer; align-items: center; justify-content: center;
      z-index: 5;
    }
    .link-wrap:hover .del { display: flex; }
    .link-wrap .del:hover { background: #dc2626; }

    /* ── Link button ─────────────────────────────────────────────────── */
    .link-btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.8rem;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 0.5rem;
      text-decoration: none; color: #374151;
      font-size: 0.8125rem; font-weight: 500; font-family: inherit;
      cursor: pointer; white-space: nowrap;
      transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s, color 0.12s;
    }
    .link-btn:hover {
      border-color: #94a3b8; box-shadow: 0 3px 10px rgba(0,0,0,0.09);
      transform: translateY(-1px); color: #0f172a;
    }
    .link-btn.inactive { opacity: 0.35; cursor: default; pointer-events: none; }
    .link-btn img { width: 14px; height: 14px; flex-shrink: 0; border-radius: 2px; }
    .link-btn .ext-ico { width: 9px; height: 9px; color: #d1d5db; flex-shrink: 0; }
    .link-btn:hover .ext-ico { color: #94a3b8; }

    /* ── Search hide ─────────────────────────────────────────────────── */
    .cat-card.hidden  { display: none; }
    .link-wrap.hidden { display: none; }
    .no-results {
      display: none; text-align: center;
      padding: 4rem 1rem; color: #94a3b8; font-size: 0.9rem;
    }

    /* ── Modal overlay ───────────────────────────────────────────────── */
    .overlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 200;
      background: rgba(15,23,42,0.5);
      align-items: center; justify-content: center; padding: 1rem;
    }
    .overlay.open { display: flex; }

    .modal {
      background: #fff; border-radius: 1rem;
      padding: 1.5rem; width: 100%; max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      animation: modalIn 0.18s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1.25rem; }

    .field { margin-bottom: 1rem; }
    .field label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: #64748b; margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .field input, .field select {
      width: 100%; padding: 0.55rem 0.75rem;
      border: 1px solid #e2e8f0; border-radius: 0.5rem;
      font-size: 0.875rem; font-family: inherit; color: #0f172a;
      background: #f8fafc; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .field input:focus, .field select:focus {
      border-color: #93c5fd; background: #fff;
      box-shadow: 0 0 0 3px rgba(147,197,253,0.25);
    }
    .field-err { font-size: 0.75rem; color: #ef4444; margin-top: 0.3rem; display: none; }

    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.25rem; }
    .btn-cancel {
      padding: 0.5rem 1rem; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 0.5rem; font-size: 0.875rem; font-family: inherit;
      color: #64748b; cursor: pointer; transition: background 0.12s;
    }
    .btn-cancel:hover { background: #f8fafc; }
    .btn-save {
      padding: 0.5rem 1.25rem; background: #3b82f6; border: none;
      border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600;
      font-family: inherit; color: #fff; cursor: pointer;
      transition: background 0.12s;
    }
    .btn-save:hover { background: #2563eb; }

    /* ── Footer ──────────────────────────────────────────────────────── */
    .footer { text-align: center; padding: 1rem; font-size: 0.7rem; color: #cbd5e1; }
    .footer a { color: #94a3b8; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    @media (max-width: 560px) {
      .site-sub { display: none; }
      .search-wrap { max-width: none; }
      .add-btn .add-label { display: none; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div>
      <div class="site-title">Clark Family</div>
      <div class="site-sub">Handy links &amp; resources</div>
    </div>
    <button class="add-btn" onclick="openModal()">
      <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      <span class="add-label">Add Link</span>
    </button>
    <div class="search-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input class="search-input" id="search" type="text"
             placeholder="Search links…" autocomplete="off"
             oninput="filterLinks(this.value)">
      <button class="clear-btn" id="clearBtn" onclick="clearSearch()">×</button>
    </div>
  </div>
</header>

<main class="main" id="main">
  <div class="no-results" id="noResults">No links match your search.</div>
</main>

<footer class="footer">
  Clark Family · <span id="yr"></span>
  &nbsp;·&nbsp;
  <a href="#" onclick="resetAll();return false;">Reset to defaults</a>
</footer>

<!-- Add Link Modal -->
<div class="overlay" id="overlay" onclick="bgClick(event)">
  <div class="modal">
    <h2>Add a Link</h2>
    <div class="field">
      <label for="fTitle">Title</label>
      <input id="fTitle" type="text" placeholder="e.g. My Bank" autocomplete="off">
      <div class="field-err" id="errTitle">Please enter a title.</div>
    </div>
    <div class="field">
      <label for="fUrl">URL</label>
      <input id="fUrl" type="text" placeholder="https://example.com" autocomplete="off">
      <div class="field-err" id="errUrl">Please enter a URL starting with https://</div>
    </div>
    <div class="field">
      <label for="fCat">Category</label>
      <select id="fCat"></select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveNewLink()">Add Link</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────
//  LINKS DATA  — edit the arrays below to change built-in links
// ─────────────────────────────────────────────────────────────────────────
const CATEGORIES = [
  {
    name: 'Banking & Finance', icon: '🏦', color: '#10b981',
    links: [
      { title: 'Bank Australia',              url: 'https://www.bankaust.com.au' },
      { title: 'Bendigo Bank',                url: 'https://www.bendigobank.com.au' },
      { title: 'Commonwealth Bank',           url: 'https://www.commbank.com.au' },
      { title: 'National Bank (NAB)',         url: 'https://www.nab.com.au' },
      { title: 'Australian Super',            url: 'https://www.australiansuper.com' },
      { title: 'MyLoan',                      url: 'https://www.myloan.com.au' },
      { title: 'ResiMac',                     url: 'https://www.resimac.com.au' },
      { title: 'Protect – Income Protection', url: 'https://www.insuranceline.com.au' },
    ]
  },
  {
    name: 'Utilities & Services', icon: '⚡', color: '#f59e0b',
    links: [
      { title: 'Powercor myEnergy',  url: 'https://myenergy.powercor.com.au' },
      { title: 'Aussie Broadband',   url: 'https://www.aussiebroadband.com.au' },
      { title: 'VentraIP',           url: 'https://ventraip.com.au' },
      { title: 'Home Lab Dashboard', url: 'http://homelab.local' },
      { title: 'MYOB Essentials',    url: 'https://www.myob.com' },
    ]
  },
  {
    name: 'Social & Entertainment', icon: '🎬', color: '#ef4444',
    links: [
      { title: 'Facebook',        url: 'https://www.facebook.com' },
      { title: 'YouTube',         url: 'https://www.youtube.com' },
      { title: 'eBay',            url: 'https://www.ebay.com.au' },
      { title: 'Honeymoon Diary', url: '#' },
    ]
  },
  {
    name: 'Search & News', icon: '🔍', color: '#3b82f6',
    links: [
      { title: 'Google',      url: 'https://www.google.com' },
      { title: 'Google Maps', url: 'https://maps.google.com' },
      { title: 'Gmail',       url: 'https://mail.google.com' },
      { title: 'Herald Sun',  url: 'https://www.heraldsun.com.au' },
    ]
  },
  {
    name: 'Property', icon: '🏠', color: '#06b6d4',
    links: [
      { title: 'Real Estate', url: 'https://www.realestate.com.au' },
    ]
  },
]
// ─────────────────────────────────────────────────────────────────────────

const LS_CUSTOM  = 'cf_custom'   // [{id,title,url,catName}]
const LS_REMOVED = 'cf_removed'  // [id, id, ...]

function getCustom()  { try { return JSON.parse(localStorage.getItem(LS_CUSTOM)  || '[]') } catch { return [] } }
function getRemoved() { try { return new Set(JSON.parse(localStorage.getItem(LS_REMOVED) || '[]')) } catch { return new Set() } }
function setCustom(v)  { localStorage.setItem(LS_CUSTOM,  JSON.stringify(v)) }
function setRemoved(v) { localStorage.setItem(LS_REMOVED, JSON.stringify([...v])) }

// built-in link ID (stable, based on content not index)
function bid(catName, title) { return 'b|' + catName + '|' + title }

// ── Render ─────────────────────────────────────────────────────────────
const EXT = `<svg class="ext-ico" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
  <path stroke-linecap="round" stroke-linejoin="round"
    d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
</svg>`

function rgb(hex) {
  const h = hex.replace('#','')
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]
}

function faviconUrl(url) {
  try { return 'https://www.google.com/s2/favicons?domain=' + new URL(url).hostname + '&sz=32' }
  catch { return '' }
}

function makeLinkNode(id, title, url) {
  const real = url && url !== '#'
  const fav  = real ? faviconUrl(url) : ''

  const wrap = document.createElement('span')
  wrap.className       = 'link-wrap'
  wrap.dataset.search  = (title + ' ' + url).toLowerCase()

  const a = document.createElement('a')
  a.className = 'link-btn' + (real ? '' : ' inactive')
  a.href      = real ? url : '#'
  if (real) { a.target = '_blank'; a.rel = 'noopener noreferrer' }
  a.title = title
  a.innerHTML = (fav ? `<img src="${fav}" alt="" onerror="this.style.display='none'">` : '<span style="font-size:10px">🔗</span>')
              + `<span>${title}</span>`
              + (real ? EXT : '')

  const del = document.createElement('button')
  del.className   = 'del'
  del.title       = 'Remove'
  del.textContent = '×'
  del.addEventListener('click', function(e) {
    e.preventDefault()
    e.stopPropagation()
    removeLink(id)
  })

  wrap.appendChild(a)
  wrap.appendChild(del)
  return wrap
}

function renderPage() {
  const main    = document.getElementById('main')
  const noRes   = document.getElementById('noResults')
  const removed = getRemoved()
  const custom  = getCustom()

  // clear old cards
  main.querySelectorAll('.cat-card').forEach(el => el.remove())

  CATEGORIES.forEach(cat => {
    const [r,g,b] = rgb(cat.color)
    const removed_ = removed  // closure

    // built-in links for this category that haven't been removed
    const builtinVisible = cat.links.filter(l => !removed_.has(bid(cat.name, l.title)))
    // custom links for this category that haven't been removed
    const customVisible  = custom.filter(l => l.catName === cat.name && !removed_.has(l.id))

    if (builtinVisible.length === 0 && customVisible.length === 0) return

    const card = document.createElement('section')
    card.className = 'cat-card'
    card.innerHTML =
      `<div class="cat-header" style="background:rgba(${r},${g},${b},0.07);border-color:rgba(${r},${g},${b},0.18)">
         <span class="cat-icon">${cat.icon}</span>
         <span class="cat-name">${cat.name}</span>
         <span class="cat-badge" style="background:rgba(${r},${g},${b},0.13);color:${cat.color}">
           ${builtinVisible.length + customVisible.length}
         </span>
       </div>
       <div class="cat-links"></div>`

    const linksDiv = card.querySelector('.cat-links')

    builtinVisible.forEach(link =>
      linksDiv.appendChild(makeLinkNode(bid(cat.name, link.title), link.title, link.url))
    )
    customVisible.forEach(link =>
      linksDiv.appendChild(makeLinkNode(link.id, link.title, link.url))
    )

    main.insertBefore(card, noRes)
  })

  // orphaned custom links (category was removed from CATEGORIES)
  const knownCats = new Set(CATEGORIES.map(c => c.name))
  const orphans   = custom.filter(l => !knownCats.has(l.catName) && !removed.has(l.id))
  if (orphans.length) {
    const card = document.createElement('section')
    card.className = 'cat-card'
    card.innerHTML =
      `<div class="cat-header" style="background:#f8fafc;border-color:#e2e8f0">
         <span class="cat-icon">🔗</span>
         <span class="cat-name">Other</span>
         <span class="cat-badge" style="background:#f1f5f9;color:#64748b">${orphans.length}</span>
       </div>
       <div class="cat-links"></div>`
    const linksDiv = card.querySelector('.cat-links')
    orphans.forEach(l => linksDiv.appendChild(makeLinkNode(l.id, l.title, l.url)))
    main.insertBefore(card, noRes)
  }
}

function removeLink(id) {
  const removed = getRemoved()
  removed.add(id)
  setRemoved(removed)
  renderPage()
  // reapply search if active
  const q = document.getElementById('search').value
  if (q) filterLinks(q)
}

// ── Search ─────────────────────────────────────────────────────────────
function filterLinks(q) {
  q = q.trim().toLowerCase()
  document.getElementById('clearBtn').style.display = q ? 'block' : 'none'

  let total = 0
  document.querySelectorAll('.cat-card').forEach(card => {
    let n = 0
    card.querySelectorAll('.link-wrap').forEach(w => {
      const show = !q || w.dataset.search.includes(q)
      w.classList.toggle('hidden', !show)
      if (show) n++
    })
    card.classList.toggle('hidden', n === 0)
    total += n
  })
  document.getElementById('noResults').style.display = total === 0 && q ? 'block' : 'none'
}

function clearSearch() {
  document.getElementById('search').value = ''
  filterLinks('')
  document.getElementById('search').focus()
}

// ── Modal ───────────────────────────────────────────────────────────────
function openModal() {
  // populate categories
  const sel = document.getElementById('fCat')
  sel.innerHTML = CATEGORIES.map(c =>
    `<option value="${c.name}">${c.icon} ${c.name}</option>`
  ).join('')

  document.getElementById('fTitle').value = ''
  document.getElementById('fUrl').value   = ''
  document.getElementById('errTitle').style.display = 'none'
  document.getElementById('errUrl').style.display   = 'none'

  document.getElementById('overlay').classList.add('open')
  setTimeout(() => document.getElementById('fTitle').focus(), 60)
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open')
}

function bgClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal()
}

function saveNewLink() {
  const title   = document.getElementById('fTitle').value.trim()
  const url     = document.getElementById('fUrl').value.trim()
  const catName = document.getElementById('fCat').value

  let ok = true
  document.getElementById('errTitle').style.display = !title ? 'block' : 'none'
  if (!title) ok = false

  const urlOk = url && (url.startsWith('http://') || url.startsWith('https://'))
  document.getElementById('errUrl').style.display = !urlOk ? 'block' : 'none'
  if (!urlOk) ok = false

  if (!ok) return

  const custom = getCustom()
  custom.push({ id: 'c|' + Date.now(), title, url, catName })
  setCustom(custom)
  closeModal()
  renderPage()
}

// ── Reset ───────────────────────────────────────────────────────────────
function resetAll() {
  if (!confirm('Remove all added links and restore any you deleted?')) return
  localStorage.removeItem(LS_CUSTOM)
  localStorage.removeItem(LS_REMOVED)
  renderPage()
}

// ── Keyboard ────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal()
  if ((e.key === 'Enter') && document.getElementById('overlay').classList.contains('open')) {
    saveNewLink()
  }
})

document.getElementById('yr').textContent = new Date().getFullYear()
renderPage()
</script>
</body>
</html>
